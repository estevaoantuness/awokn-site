<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awokn: o alarme que te coloca de pé</title>
<meta name="description" content="O alarme toca e a câmera do iPhone conta suas flexões, ao vivo e no aparelho. Cinco flexões depois, o dia já começou.">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
</head>
<body>
<style>
  /* Tema único deliberado: o amanhecer escuro com a aurora lilás do orb.
     Fundo e cores pintados explicitamente pra segurar em qualquer host. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0E0D0B;
    color: #F5F5F3;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  canvas#aurora {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  .brand {
    position: absolute;
    top: 2rem;
    display: flex;
    align-items: center;
    gap: .6rem;
    animation: rise .7s ease-out both;
  }
  .brand img {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid rgba(245, 245, 243, 0.14);
    display: block;
  }
  .brand span {
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: clamp(2.3rem, 7vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.04;
    text-wrap: balance;
    text-shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
    animation: rise .7s ease-out .15s both;
  }
  p {
    margin-top: 1.4rem;
    max-width: 30rem;
    font-size: 1.05rem;
    line-height: 1.6;
    color: rgba(245, 245, 243, 0.72);
    animation: rise .7s ease-out .25s both;
  }
  .cta {
    margin-top: 2.6rem;
    display: inline-block;
    background: #F5F5F3;
    color: #111111;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    padding: 1.05rem 2.4rem;
    border-radius: 999px;
    animation: rise .7s ease-out .35s both;
    transition: transform .15s ease, opacity .15s ease;
  }
  .cta:hover { transform: translateY(-1px); opacity: .92; }
  .cta:focus-visible { outline: 3px solid #C7BFFF; outline-offset: 3px; }
  .foot {
    position: absolute;
    bottom: 1.6rem;
    font-size: .82rem;
    color: rgba(245, 245, 243, 0.5);
  }
  .foot a {
    color: rgba(245, 245, 243, 0.6);
    text-decoration: none;
  }
  .foot a:hover { color: #F5F5F3; text-decoration: underline; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .brand, h1, p, .cta { animation: none; }
  }
</style>

  <h1>Acordar é fácil.<br>Levantar é o problema.</h1>
  <p>O alarme toca e a câmera conta suas flexões. Cinco depois, o dia já começou.</p>

<script>
(function () {
  var canvas = document.getElementById("aurora");
  var gl = canvas.getContext("webgl");
  if (!gl) { return; }

  var vert = "attribute vec2 position;varying vec2 vUv;void main(){vUv=position*0.5+0.5;gl_Position=vec4(position,0.0,1.0);}";
  var frag = [
    "precision highp float;varying vec2 vUv;",
    "uniform vec2 u_resolution;uniform float u_time;uniform float u_grain;",
    "uniform vec3 u_colors[4];uniform vec3 u_bg;",
    "vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}",
    "float snoise(vec2 v){",
    "  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);",
    "  vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);",
    "  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);",
    "  vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod(i,289.0);",
    "  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));",
    "  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);",
    "  m=m*m;m=m*m;",
    "  vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;",
    "  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);",
    "  vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;",
    "  return 130.0*dot(m,g);}",
    "void main(){",
    "  vec2 uv=vUv;float ratio=u_resolution.x/u_resolution.y;",
    "  vec2 p=uv-0.5;p.x*=ratio;",
    "  float t=u_time*0.1;",
    "  float n1=snoise(p*0.4+vec2(t*0.2,-t*0.3));",
    "  float n2=snoise(p*0.55+vec2(-t*0.15,t*0.25)+n1*0.25);",
    "  float n3=snoise(p*0.75+vec2(t*0.1,-t*0.2)+n2*0.2);",
    "  vec3 col=u_bg;",
    "  float dist=length(p)*1.5;",
    "  float vignette=1.0-smoothstep(0.3,1.2,dist);",
    "  col=mix(col,u_colors[0],smoothstep(-0.2,0.5,n1)*0.85);",
    "  col=mix(col,u_colors[1],smoothstep(-0.1,0.6,n2)*0.7);",
    "  col=mix(col,u_colors[2],smoothstep(-0.3,0.4,n3)*0.6);",
    "  col=mix(col,u_colors[3],smoothstep(0.0,0.7,n1*n2)*0.5);",
    "  float glow=smoothstep(0.8,0.0,dist)*0.15;",
    "  col+=u_colors[1]*glow;",
    "  col=mix(col*0.2,col,vignette);col*=0.82;",
    "  float grain=fract(sin(dot(uv,vec2(12.9898,78.233)))*43758.5453+u_time);",
    "  col+=(grain-0.5)*u_grain*0.1;",
    "  gl_FragColor=vec4(col,1.0);}"
  ].join("\n");

  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var pos = gl.getAttribLocation(prog, "position");
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

  var locs = {
    res: gl.getUniformLocation(prog, "u_resolution"),
    time: gl.getUniformLocation(prog, "u_time"),
    grain: gl.getUniformLocation(prog, "u_grain"),
    colors: gl.getUniformLocation(prog, "u_colors"),
    bg: gl.getUniformLocation(prog, "u_bg")
  };

  function rgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255
    ];
  }

  /* Lilás leve da identidade (orb da Home), afundando no #0E0D0B. */
  var COLORS = ["#C7BFFF", "#A99EF0", "#6F63C8", "#0E0D0B"];
  var BG = rgb("#0E0D0B");
  var flat = new Float32Array([].concat(rgb(COLORS[0]), rgb(COLORS[1]), rgb(COLORS[2]), rgb(COLORS[3])));
  var SPEED = 1.2;
  var GRAIN = 0.25;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function draw(t) {
    gl.uniform2f(locs.res, canvas.width, canvas.height);
    gl.uniform1f(locs.time, t * 0.001 * SPEED);
    gl.uniform1f(locs.grain, GRAIN);
    gl.uniform3f(locs.bg, BG[0], BG[1], BG[2]);
    gl.uniform3fv(locs.colors, flat);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (!still) { requestAnimationFrame(draw); }
  }
  requestAnimationFrame(draw);
})();
</script>
